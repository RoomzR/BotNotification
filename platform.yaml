vision:
  model: yolov8s.pt
  confidence: 0.32
  # своя еда: держать в кадре N сек, потом алерт
  confirm_seconds: 10
  # не спамить одной и той же камерой
  cooldown_seconds: 300
  cameras_per_cycle: 4
  show_dashboard: true
  # 4–5 камер в ряд (крупнее плитки в Desktop)
  dashboard_cols: 5
  reception_presence_seconds: 30
  # для own_products брать main stream (лучше OCR/embedding)
  prefer_mainstream_for_own: true
  embedding:
    enabled: true
    model: "ViT-B-32"
    club_min_score: 0.27
    own_if_below: 0.20
    margin: 0.035
  own_products:
    alert_on_unknown_held: true
    person_pad: 0.32
    # ниже порога — только soft-алерты + баннер «каталог неполный»
    min_catalog_coverage: 0.9

alerts:
  send_photo: true
  # мягкий режим: «подозрительно» vs «точно своё»
  soft_mode: true
  # подозрительные дольше держать в кадре и реже слать в Telegram
  soft_confirm_seconds: 25
  soft_cooldown_seconds: 600
  # false = подозрительные только в UI/Алерты, без Telegram (рекомендуется до полного каталога)
  soft_telegram: false

rules:
  - id: no_own_food_drink
    title: "Своя еда и напитки запрещены"
    severity: high
    text: "Проносить еду и напитки, купленные вне клуба, запрещено. Только продукция бара CyberX."

